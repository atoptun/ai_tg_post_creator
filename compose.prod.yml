services:
  nginx:
    volumes:
      - ./logs/prod/nginx:/var/log/nginx

  api:
    build:
      context: .
      target: production
    # command: fastapi run --host 0.0.0.0 --port 8000 --workers 4
    command: >
      gunicorn app.main:app 
      --workers 6 
      --worker-class uvicorn.workers.UvicornWorker 
      --bind 0.0.0.0:8000 
      --timeout 120
      --error-logfile /app/logs/gunicorn_error.log
      --access-logfile /app/logs/gunicorn_access.log
    volumes:
      - ./logs/prod:/app/logs

  celery_worker:
    build:
      context: .
      target: production
    volumes:
      - ./logs/prod:/app/logs

  celery_beat:
    build:
      context: .
      target: production
    volumes:
      - ./logs/prod:/app/logs

  flower:
    build:
      context: .
      target: production
    volumes:
      - ./logs/prod:/app/logs

  postgres:
    volumes:
      - pg_data:/var/lib/postgresql

  pgadmin4:
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  rabbitmq:
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia

  redis:
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  pgadmin_data:
  rabbitmq_data:
  redis_data: