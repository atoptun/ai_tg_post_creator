services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_OUT_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # api:
      #   condition: service_healthy
      flower:
        condition: service_started

  api:
    build: .
    command: fastapi run --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LOG_NAME=api
      - LOG_FILE=/app/logs/api.log
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  celery_worker:
    build: .
    command: >
      celery -A app.celery_worker.celery_app worker
      --loglevel=info 
      --concurrency=2
      --events
    environment:
      - LOG_NAME=celery_worker
      - LOG_FILE=/app/logs/celery_worker.log
    env_file:
      - .env
    depends_on:
      # api:
      #   condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A app.celery_worker.celery_app beat --loglevel=info
    environment:
      - LOG_NAME=celery_beat
      - LOG_FILE=/app/logs/celery_beat.log
    env_file:
      - .env
    depends_on:
      - celery_worker

  flower:
    build: .
    command: >
      celery -A app.celery_worker.celery_app flower 
      --port=5555 
      --url_prefix=flower
      --broker_api=http://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:15672/api/
    environment:
      - LOG_NAME=flower
      - LOG_FILE=/app/logs/celery_flower.log
    env_file:
      - .env
    depends_on:
      - celery_worker

  postgres:
    image: postgres:18-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin4:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    user: "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    # ports:
    #   - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:management-alpine
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes


